[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verified-commerce-mail"
version = "0.1.0"
description = "Typed Python example for verified signup and ordered commerce notifications through one Infrai credential."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.8,<3", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools]
py-modules = ["infrai_gateway", "commerce_workflow", "shop_signup"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
